linkWorkspacePackages: true

packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true

# Supply-chain hardening (see https://pnpm.io/supply-chain-security)
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy-line releases published without provenance after newer lines had it (long-vetted)
  - chokidar@4.0.3
  - semver@6.3.1

catalog:
  "@zag-js/anatomy": ^1.44.0
  "@zag-js/collection": ^1.44.0
  "@zag-js/core": ^1.44.0
  "@zag-js/date-input": ^1.44.0
  "@zag-js/dom-query": ^1.44.0
  "@zag-js/focus-visible": ^1.44.0
  "@zag-js/popover": ^1.44.0
  "@zag-js/preact": ^1.44.0
  "@zag-js/react": ^1.44.0
  "@zag-js/solid": ^1.44.0
  "@zag-js/svelte": ^1.44.0
  "@zag-js/types": ^1.44.0
  "@zag-js/utils": ^1.44.0
  "@zag-js/vanilla": ^1.44.0
  "@zag-js/vue": ^1.44.0
  "@storybook/addon-docs": ^10.6.0
  "@storybook/html-vite": ^10.6.0
  "@storybook/preact-vite": ^10.6.0
  "@storybook/react-vite": ^10.6.0
  "@storybook/svelte-vite": ^10.6.0
  "@storybook/vue3-vite": ^10.6.0
  storybook: ^10.6.0
  storybook-solidjs-vite: ^10.7.2
  vite: ^8.3.0
